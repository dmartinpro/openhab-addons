# channel types

channel-type.diagral.anomalies-present.label = Anomalies Present
channel-type.diagral.anomalies-present.description = Indicates if any anomalies are present in the system
channel-type.diagral.anomaly-count.label = Anomaly Count
channel-type.diagral.anomaly-count.description = Number of active anomalies in the system
channel-type.diagral.armed-status.label = Armed Status
channel-type.diagral.armed-status.description = Current armed status of the alarm system
channel-type.diagral.armed-status.state.option.OFF = Off
channel-type.diagral.armed-status.state.option.FULL = Full
