channel-type.diagral.group-id.label = Group ID
channel-type.diagral.group-id.description = The Diagral group's own numeric identifier, as assigned in the Diagral installer app. Used to target this group in activate-groups/disable-groups batch commands.
channel-type.diagral.mode-control.label = Mode Control
channel-type.diagral.mode-control.description = Control the alarm system mode
channel-type.diagral.mode-control.command.option.OFF = Disarm
channel-type.diagral.mode-control.command.option.FULL = Arm Full
channel-type.diagral.mode-control.command.option.PRESENCE = Presence Mode
