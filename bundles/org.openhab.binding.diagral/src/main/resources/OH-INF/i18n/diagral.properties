channel-type.diagral.contact.label = Contact
channel-type.diagral.contact.description = Open/closed state of the door or window (always UNDEF - the Diagral cloud API exposes no real-time contact state)
channel-type.diagral.group-batch-activate.label = Activate Groups
channel-type.diagral.group-batch-activate.description = Activates several device groups at once. Command value is a comma-separated list of numeric group IDs (e.g. "1,3,5"), sent to the Diagral API in a single request.
channel-type.diagral.group-batch-disable.label = Disable Groups
channel-type.diagral.group-batch-disable.description = Disables several device groups at once. Command value is a comma-separated list of numeric group IDs (e.g. "1,3,5"), sent to the Diagral API in a single request.
channel-type.diagral.device-enabled-readonly.label = Device Enabled
channel-type.diagral.device-enabled-readonly.description = Indicates if the device is enabled (this device type has no enable/disable action in the Diagral API)
channel-type.diagral.device-enabled.label = Device Enabled
channel-type.diagral.device-enabled.description = Enables/disables (un-inhibits/inhibits) the device
