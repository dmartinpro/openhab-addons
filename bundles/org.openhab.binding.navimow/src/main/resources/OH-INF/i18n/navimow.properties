# add-on

addon.navimow.name = Navimow Binding
addon.navimow.description = This is the binding for Segway Navimow robotic lawn mowers.

# thing types

thing-type.navimow.account.label = Navimow Account
thing-type.navimow.account.description = A Segway Navimow cloud account. Authorization happens through a browser-based login flow: once this bridge is created, check its status for a link to sign in.
thing-type.navimow.mower.label = Navimow Mower
thing-type.navimow.mower.description = A Navimow robotic lawn mower linked to a Navimow account.

# thing types config

thing-type.config.navimow.account.pollingInterval.label = Polling Interval
thing-type.config.navimow.account.pollingInterval.description = How often, in seconds, to poll the cloud API for mower status.
thing-type.config.navimow.mower.id.label = Device ID
thing-type.config.navimow.mower.id.description = The device id as reported by the cloud API. Normally filled in automatically by discovery.

# channel types

channel-type.navimow.activity.label = Activity
channel-type.navimow.activity.description = The mower's current canonical activity, normalized from the cloud API's raw state.
channel-type.navimow.activity.state.option.idle = Idle
channel-type.navimow.activity.state.option.mowing = Mowing
channel-type.navimow.activity.state.option.paused = Paused
channel-type.navimow.activity.state.option.docked = Docked
channel-type.navimow.activity.state.option.charging = Charging
channel-type.navimow.activity.state.option.returning = Returning
channel-type.navimow.activity.state.option.error = Error
channel-type.navimow.activity.state.option.unknown = Unknown
channel-type.navimow.control.label = Control
channel-type.navimow.control.description = Sends a command to the mower.
channel-type.navimow.control.command.option.START = Start Mowing
channel-type.navimow.control.command.option.STOP = Stop
channel-type.navimow.control.command.option.PAUSE = Pause
channel-type.navimow.control.command.option.RESUME = Resume
channel-type.navimow.control.command.option.DOCK = Return to Dock

# thing status descriptions

conf-error-invalid-polling-interval = Polling interval must be at least 10 seconds.
conf-error-authorization-required = Authorization required: open http(s)://<YOUROPENHAB>:<YOURPORT>{0} in a browser to sign in to your Navimow account.
conf-error-no-device-id = No device id configured for this mower.
offline.comm-error-no-status-returned = The cloud API did not return a status for this device.
